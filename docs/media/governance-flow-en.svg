<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Project Intelligent Governance Center flow</title>
  <desc id="desc">A visual overview of the global bridge, project-local governance layer, verification, writeback, and central method loop.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 34px "Segoe UI",Arial,sans-serif;fill:#172033}.sub{font:400 17px "Segoe UI",Arial,sans-serif;fill:#546174}.head{font:700 18px "Segoe UI",Arial,sans-serif;fill:#243044}.label{font:700 15px "Segoe UI",Arial,sans-serif;fill:#172033}.small{font:400 12px "Segoe UI",Arial,sans-serif;fill:#536174}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#eef6ff;stroke:#8db9e5}.green{fill:#eef8f3;stroke:#8bc5a8}.amber{fill:#fff6e8;stroke:#deb36b}.shell{fill:#fff;stroke:#6f8fb5;stroke-width:2}.central{fill:#f8fbff;stroke:#91a9c9;stroke-width:2}.decision{fill:#fffaf0;stroke:#d7a947;stroke-width:1.8}.arrow{stroke:#66758a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.yes{stroke:#2f8f62;stroke-width:2.4;fill:none;marker-end:url(#yes)}.no{stroke:#b2732c;stroke-width:2.2;fill:none;marker-end:url(#no)}.dash{stroke:#6e7f96;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#66758a"/></marker>
    <marker id="yes" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2f8f62"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b2732c"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="60" y="58">Project Intelligent Governance Center</text>
  <text class="sub" x="60" y="86">A lightweight route from messy AI-assisted work to project-local, verifiable governance.</text>

  <rect class="box blue" x="60" y="126" width="155" height="78" rx="10"/>
  <text class="label" x="137.5" y="157" text-anchor="middle">User Goal</text>
  <text class="small" x="137.5" y="181" text-anchor="middle">intent and scope</text>
  <rect class="box" x="260" y="126" width="165" height="78" rx="10"/>
  <text class="label" x="342.5" y="157" text-anchor="middle">Agent Session</text>
  <text class="small" x="342.5" y="181" text-anchor="middle">reads current evidence</text>
  <rect class="box green" x="470" y="126" width="175" height="78" rx="10"/>
  <text class="label" x="557.5" y="157" text-anchor="middle">Global Bridge</text>
  <text class="small" x="557.5" y="181" text-anchor="middle">routes to the project</text>
  <rect class="box" x="690" y="126" width="190" height="78" rx="10"/>
  <text class="label" x="785" y="157" text-anchor="middle">Project AGENTS.md</text>
  <text class="small" x="785" y="181" text-anchor="middle">local entry rules</text>
  <rect class="box" x="925" y="126" width="180" height="78" rx="10"/>
  <text class="label" x="1015" y="157" text-anchor="middle">Topic Map</text>
  <text class="small" x="1015" y="181" text-anchor="middle">smallest useful context</text>

  <path class="arrow" d="M215 165H260"/>
  <path class="arrow" d="M425 165H470"/>
  <path class="arrow" d="M645 165H690"/>
  <path class="arrow" d="M880 165H925"/>

  <rect class="shell" x="80" y="280" width="610" height="250" rx="16"/>
  <text class="head" x="112" y="316">Project-Local Governance Layer</text>
  <text class="small" x="112" y="340">The authoritative layer for the target project's real work.</text>
  <rect class="box blue" x="112" y="368" width="250" height="62" rx="9"/>
  <text class="label" x="237" y="393" text-anchor="middle">Source Boundaries</text>
  <text class="small" x="237" y="414" text-anchor="middle">authority, evidence, output</text>
  <rect class="box blue" x="410" y="368" width="250" height="62" rx="9"/>
  <text class="label" x="535" y="393" text-anchor="middle">Context Management</text>
  <text class="small" x="535" y="414" text-anchor="middle">read only what the task needs</text>
  <rect class="box green" x="112" y="452" width="250" height="62" rx="9"/>
  <text class="label" x="237" y="477" text-anchor="middle">Durable Decisions</text>
  <text class="small" x="237" y="498" text-anchor="middle">align future sessions</text>
  <rect class="box green" x="410" y="452" width="250" height="62" rx="9"/>
  <text class="label" x="535" y="477" text-anchor="middle">Verification Probes</text>
  <text class="small" x="535" y="498" text-anchor="middle">test routing and safety</text>
  <path class="dash" d="M535 514V548H237V514"/>
  <path class="arrow" d="M1015 204V250H385V280"/>

  <rect class="box amber" x="760" y="352" width="175" height="82" rx="10"/>
  <text class="label" x="847.5" y="384" text-anchor="middle">Writeback Result</text>
  <text class="small" x="847.5" y="408" text-anchor="middle">none, local, or deferred</text>
  <path class="arrow" d="M690 405H760"/>

  <polygon class="decision" points="1065,330 1160,392 1065,454 970,392"/>
  <text class="label" x="1065" y="386" text-anchor="middle">Reusable</text>
  <text class="label" x="1065" y="407" text-anchor="middle">pattern?</text>
  <path class="arrow" d="M935 393H970"/>

  <rect class="box amber" x="830" y="478" width="170" height="58" rx="9"/>
  <text class="label" x="915" y="502" text-anchor="middle">Keep Local</text>
  <text class="small" x="915" y="522" text-anchor="middle">project-specific knowledge</text>
  <path class="no" d="M1020 438L968 478"/>
  <text class="small" x="984" y="458">No</text>

  <rect class="central" x="760" y="585" width="430" height="88" rx="16"/>
  <text class="head" x="792" y="620">Central Method Library</text>
  <text class="small" x="792" y="644">Reusable principles, adoption playbooks, verification rules, and patterns.</text>
  <path class="yes" d="M1105 445V585"/>
  <text class="small" x="1116" y="510">Yes</text>
  <path class="dash" d="M1190 629H1228V165H1105"/>
  <text class="small" x="1040" y="696" text-anchor="middle">Central method improves future project adoption without overwriting local reality.</text>
</svg>
